name: Build iOS IPA & Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # تجميع ملف iOS (IPA) عبر خوادم Mac السحابية
  # ==========================================
  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Generate Clean Native Xcode Project
        run: |
          rm -rf ios
          flutter create --project-name zied_debts --org com.zied --platforms ios .
          plutil -replace CFBundleDisplayName -string "زيد اياد للديون" ios/Runner/Info.plist || true
          plutil -replace UIFileSharingEnabled -bool true ios/Runner/Info.plist || true
          plutil -replace LSSupportsOpeningDocumentsInPlace -bool true ios/Runner/Info.plist || true

      - name: Prepare Flutter iOS Config and Default Podfile
        run: |
          flutter pub get
          flutter build ios --config-only --no-codesign || true

      - name: Configure Podfile Platform and Disable Signing
        run: |
          if [ -f ios/Podfile ]; then
            sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/g" ios/Podfile || true
            sed -i '' "s/platform :ios, '12.0'/platform :ios, '13.0'/g" ios/Podfile || true
            sed -i '' "s/flutter_additional_ios_build_settings(target)/flutter_additional_ios_build_settings(target); target.build_configurations.each { |c| c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'; c.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'; c.build_settings['CODE_SIGN_IDENTITY'] = '-' }/g" ios/Podfile || true
          fi
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          echo "EXPANDED_CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Za-z0-9]*;/DEVELOPMENT_TEAM = "";/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Build iOS Application Bundle
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee ios_build.log

      - name: Inspect Build Output & Error Summary
        if: always()
        run: |
          echo "=== SEARCHING FOR RUNNER.APP ==="
          find build -name "Runner.app" || true
          echo "=== BUILD LOG SUMMARY (LAST 80 LINES) ==="
          tail -n 80 ios_build.log || true

      - name: Push build log to repo branch
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-logs
          git add -f ios_build.log || true
          git commit -m "Upload ios_build.log" || true
          git push origin build-logs --force || true

      - name: Upload iOS Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Build-Log
          path: ios_build.log

      - name: Package into IPA
        run: |
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found in build directory!"
            find build -maxdepth 5 || true
            exit 1
          fi
          echo "Found Runner.app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ZiedAeadDebts.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZiedAeadDebts-iOS-IPA
          path: ZiedAeadDebts.ipa

  # ==========================================
  # تجميع ملف Android (APK)
  # ==========================================
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Generate Clean Native Android Project
        run: |
          rm -rf android
          flutter create --project-name zied_debts --org com.zied --platforms android .

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Build APK Release
        run: |
          flutter build apk --release 2>&1 | tee android_build.log

      - name: Show Android error summary on failure
        if: failure()
        run: |
          echo "=== ANDROID BUILD ERROR SUMMARY ==="
          grep -E -C 2 -i "(error:|failed|fatal:)" android_build.log | head -n 80 || tail -n 80 android_build.log

      - name: Upload Android Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Log
          path: android_build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZiedAeadDebts-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
