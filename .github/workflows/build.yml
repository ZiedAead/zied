name: Build iOS IPA & Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # تجميع ملف iOS (IPA) عبر خوادم Mac السحابية
  # ==========================================
  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Generate Clean Native Xcode Project
        run: |
          rm -rf ios
          flutter create --org com.zied --platforms ios zied_debts
          cp -r zied_debts/ios .
          rm -rf zied_debts
          plutil -replace CFBundleDisplayName -string "زيد اياد للديون" ios/Runner/Info.plist || true
          plutil -replace UIFileSharingEnabled -bool true ios/Runner/Info.plist || true
          plutil -replace LSSupportsOpeningDocumentsInPlace -bool true ios/Runner/Info.plist || true

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Build iOS Application Bundle
        run: |
          flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ZiedAeadDebts.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZiedAeadDebts-iOS-IPA
          path: ZiedAeadDebts.ipa

  # ==========================================
  # تجميع ملف Android (APK)
  # ==========================================
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Generate Clean Native Android Project
        run: |
          rm -rf android
          flutter create --org com.zied --platforms android zied_debts
          cp -r zied_debts/android .
          rm -rf zied_debts

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZiedAeadDebts-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
