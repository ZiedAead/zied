name: Build iOS IPA & Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # تجميع ملف iOS (IPA) عبر خوادم Mac السحابية
  # ==========================================
  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Clean Native Xcode Project
        run: |
          mkdir -p /tmp/backup_ios
          cp ios/Runner/Info.plist /tmp/backup_ios/Info.plist || true
          rm -rf ios
          flutter create . --org com.zied --project-name zied_debts --platforms ios
          if [ -f /tmp/backup_ios/Info.plist ]; then
            cp /tmp/backup_ios/Info.plist ios/Runner/Info.plist
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Application Bundle
        run: |
          flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ZiedAeadDebts.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZiedAeadDebts-iOS-IPA
          path: ZiedAeadDebts.ipa

  # ==========================================
  # تجميع ملف Android (APK)
  # ==========================================
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Clean Native Android Project
        run: |
          mkdir -p /tmp/backup_android
          cp android/app/src/main/AndroidManifest.xml /tmp/backup_android/AndroidManifest.xml || true
          rm -rf android
          flutter create . --org com.zied --project-name zied_debts --platforms android
          if [ -f /tmp/backup_android/AndroidManifest.xml ]; then
            cp /tmp/backup_android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZiedAeadDebts-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
