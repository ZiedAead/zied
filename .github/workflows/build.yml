name: Build iOS IPA & Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # تجميع ملف iOS (IPA) عبر خوادم Mac السحابية
  # ==========================================
  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Generate Clean Native Xcode Project
        run: |
          rm -rf ios
          flutter create --project-name zied_debts --org com.zied --platforms ios .
          plutil -replace CFBundleDisplayName -string "زيد اياد للديون" ios/Runner/Info.plist || true
          plutil -replace UIFileSharingEnabled -bool true ios/Runner/Info.plist || true
          plutil -replace LSSupportsOpeningDocumentsInPlace -bool true ios/Runner/Info.plist || true

      - name: Configure iOS Podfile with iOS 13.0 and No Code Signing
        run: |
          cat << 'EOF' > ios/Podfile
          platform :ios, '13.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', { 'Debug' => :debug, 'Profile' => :release, 'Release' => :release }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', '..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist"
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = '-'
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = '-'
              end
            end
          end
          EOF

      - name: Disable Xcode Code Signing
        run: |
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          echo "EXPANDED_CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Za-z0-9]*;/DEVELOPMENT_TEAM = "";/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Build iOS Application Bundle
        run: |
          flutter build ios --release --no-codesign 2>&1 | tee ios_build.log

      - name: Show iOS error summary on failure
        if: failure()
        run: |
          echo "=== IOS BUILD ERROR SUMMARY ==="
          grep -E -C 2 -i "(error:|failed|fatal:)" ios_build.log | head -n 80 || tail -n 80 ios_build.log

      - name: Upload iOS Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Build-Log
          path: ios_build.log

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ZiedAeadDebts.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZiedAeadDebts-iOS-IPA
          path: ZiedAeadDebts.ipa

  # ==========================================
  # تجميع ملف Android (APK)
  # ==========================================
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Generate Clean Native Android Project
        run: |
          rm -rf android
          flutter create --project-name zied_debts --org com.zied --platforms android .

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Build APK Release
        run: |
          flutter build apk --release 2>&1 | tee android_build.log

      - name: Show Android error summary on failure
        if: failure()
        run: |
          echo "=== ANDROID BUILD ERROR SUMMARY ==="
          grep -E -C 2 -i "(error:|failed|fatal:)" android_build.log | head -n 80 || tail -n 80 android_build.log

      - name: Upload Android Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Log
          path: android_build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZiedAeadDebts-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
